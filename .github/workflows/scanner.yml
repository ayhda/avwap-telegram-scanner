name: AVWAP Telegram Scanner Bot

on:
  schedule:
    # Run every 30 minutes (00:00, 00:30, 01:00, 01:30 UTC, etc.)
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run mode (prints to log without sending to Telegram)'
        required: false
        type: boolean
        default: false
      exchange:
        description: 'Preferred exchange (bitget or bybit)'
        required: false
        type: choice
        options:
          - bitget
          - bybit
        default: bitget

permissions:
  contents: write

concurrency:
  group: avwap-scanner-run
  cancel-in-progress: false

jobs:
  scan-and-alert:
    name: Run AVWAP Scanner
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir -r requirements.txt

      - name: Execute AVWAP Scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          PREFERRED_EXCHANGE: ${{ github.event.inputs.exchange || 'bitget' }}
        run: |
          python main.py

      - name: Commit and Push State Updates
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add previous_states.json
          # Commit only if previous_states.json has changes
          if ! git diff --staged --quiet; then
            git commit -m "chore(cache): update AVWAP scanner state [skip ci]"
            git push
          else
            echo "No state changes detected. Working tree clean."
          fi
